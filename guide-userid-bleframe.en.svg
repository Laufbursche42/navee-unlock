<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 190" role="img" aria-label="Layout of the 0x30 auth frame with the userId bytes">
  <rect x="1" y="1" width="578" height="188" rx="12" fill="#f6f8fb" stroke="#d3dae3"/>
  <text x="20" y="30" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2b3a">0x30 auth frame of the app (from the Bluetooth HCI log)</text>
  <rect x="178" y="52" width="30" height="28" rx="4" fill="#eef1f6" stroke="#9aa7ba"/>
  <rect x="240" y="52" width="196" height="28" rx="4" fill="#e2f5ea" stroke="#1a8f4c"/>
  <g font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" fill="#1f2b3a" text-anchor="middle">
    <text x="36" y="72">55</text><text x="68" y="72">AA</text><text x="100" y="72">00</text><text x="132" y="72">30</text><text x="164" y="72">09</text>
    <text x="196" y="72" font-weight="700" fill="#3a4759">01</text>
    <text x="228" y="72">00</text>
    <text x="260" y="72" font-weight="700" fill="#1a8f4c">8A</text><text x="292" y="72" font-weight="700" fill="#1a8f4c">00</text><text x="324" y="72" font-weight="700" fill="#1a8f4c">4A</text><text x="356" y="72" font-weight="700" fill="#1a8f4c">9F</text><text x="388" y="72" font-weight="700" fill="#1a8f4c">2C</text><text x="420" y="72" font-weight="700" fill="#1a8f4c">1B</text>
    <text x="452" y="72">00</text><text x="484" y="72">34</text><text x="516" y="72">FE</text><text x="548" y="72">FD</text>
  </g>
  <text x="193" y="104" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#3a4759" text-anchor="middle">keyIdx</text>
  <path d="M244 88 L244 96 L432 96 L432 88" fill="none" stroke="#1a8f4c" stroke-width="1.5"/>
  <text x="338" y="116" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1a8f4c" text-anchor="middle">userId (8A 00 plus 4 bytes)</text>
  <text x="20" y="150" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#1f2b3a">Copy exactly this hex string and paste it in the tool under</text>
  <text x="20" y="170" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#1f2b3a">Advanced into the Auth frame (hex) field.</text>

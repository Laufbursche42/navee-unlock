<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" role="img" aria-label="Schema der Login-Antwort mit hervorgehobener userId">
  <rect x="1" y="1" width="578" height="248" rx="12" fill="#f6f8fb" stroke="#d3dae3"/>
  <text x="20" y="30" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2b3a">Antwort des Login-Aufrufs (lj.naveetech.com)</text>
  <g font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" fill="#1f2b3a">
    <text x="24" y="66">{</text>
    <text x="44" y="90">"code": 200,</text>
    <text x="44" y="114">"data": {</text>
    <text x="64" y="138" fill="#6b7a90">"token": "e9f1c2...",</text>
    <rect x="58" y="150" width="330" height="26" rx="5" fill="#e2f5ea" stroke="#1a8f4c"/>
    <text x="64" y="168"><tspan fill="#1f2b3a">"userId": </tspan><tspan fill="#1a8f4c" font-weight="700">1234567890</tspan></text>
    <text x="44" y="196">}</text>
    <text x="24" y="220">}</text>
  </g>
  <text x="400" y="168" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1a8f4c">&lt;- diese Zahl</text>
  <text x="400" y="186" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7a90">höchstens 10 Stellen</text>
  <text x="64" y="240" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7a90">token ist die Sitzung und wechselt, userId bleibt gleich</text>
</svg>

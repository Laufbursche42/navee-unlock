<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche NAVEE Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub">NAVEE Tool</span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="feasib"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="btns">
      <button class="primary" id="btn-connect" data-t="btnConnect"></button>
      <button id="btn-disconnect" data-t="btnDisconnect"></button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="showall"> <span data-t="showAll"></span></label>
    </div>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card">
    <h2 data-t="liveTitle"></h2>
    <div class="grid">
      <div class="tile"><b id="t-region">-</b><small data-t="tileRegion"></small></div>
      <div class="tile"><b id="t-sku">-</b><small data-t="tileSku"></small></div>
      <div class="tile"><b id="t-max">-</b><small data-t="tileMax"></small></div>
      <div class="tile"><b id="t-limit">-</b><small data-t="tileLimit"></small></div>
    </div>
    <div class="row"><span class="fin"><span data-t="serialLabel"></span> <span id="t-sn">-</span></span></div>
    <div class="btns">
      <button class="span2" id="btn-read" data-t="btnRead" disabled></button>
    </div>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card">
    <div class="card-head"><h2 data-t="s3Title"></h2><button type="button" class="help-btn" data-help="speed" aria-label="Info">?</button></div>
    <div class="row">
      <label class="full" data-t="lblSpeed"></label>
      <input id="speed-in" type="number" inputmode="numeric" min="0" max="255" placeholder="32" disabled>
    </div>
    <div class="btns">
      <button class="primary" id="btn-setspeed" data-t="btnSetSpeed" disabled></button>
      <button id="btn-setlimit" data-t="btnSetLimit" disabled></button>
    </div>
    <p class="hint" data-t="speedHint"></p>
  </div>

  <div class="card">
    <div class="card-head"><h2 data-t="s4Title"></h2><button type="button" class="help-btn" data-help="country" aria-label="Info">?</button></div>
    <div class="row">
      <label class="full" data-t="lblCountry"></label>
      <input id="country-in" type="number" inputmode="numeric" min="0" max="255" placeholder="0-25" disabled>
    </div>
    <div class="btns">
      <button class="primary" id="btn-unlock" data-t="btnUnlock" disabled></button>
      <button id="btn-scan" data-t="btnScan" disabled></button>
    </div>
    <p class="hint" data-t="regionHint"></p>
    <details>
      <summary data-t="advTitle"></summary>
      <p class="hint" data-t="advHint"></p>
      <div class="row">
        <input id="uid-in" type="number" inputmode="numeric" data-t-ph="uidPlaceholder">
        <button type="button" class="help-btn" data-help="account" aria-label="Info">?</button>
      </div>
      <div class="row">
        <input id="authhex-in" autocapitalize="off" autocomplete="off" spellcheck="false" data-t-ph="authhexPlaceholder">
        <button type="button" class="help-btn" data-help="authhex" aria-label="Info">?</button>
      </div>
    </details>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="footlinks">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/navee-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="ver" id="build-ver"></span>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<script src="i18n.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
